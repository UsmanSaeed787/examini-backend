[project]
name = "examini-backend"
version = "1.0.0"
description = "Exam Management System Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "cloudinary>=1.40.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "google-auth>=2.42.1",
    "requests>=2.32.5",
    "openai-agents>=0.2.0",
    "alembic>=1.18.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

